name: BALA E FOGO - Solicitar licença Unity Personal

on:
  workflow_dispatch:

jobs:
  request-activation:
    name: Gerar arquivo .alf para licença Personal
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar arquivo de ativação Unity
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2019.2.6f1

      - name: Publicar arquivo .alf
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Personal-Activation
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7
