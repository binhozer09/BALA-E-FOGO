name: BALA E FOGO - Ativar Unity Personal e gerar APK na nuvem

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-first-playable
    paths:
      - '.github/workflows/unity-cloud-personal-build.yml'
      - 'UnityPUBG/**'

jobs:
  build-android:
    name: Ativar Personal e compilar APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      UNITY_NO_CLI_INVOKED_TELEMETRY: '1'
      UNITY_NO_CRASH_REPORT: '1'
      UNITY_NO_UPDATE_CHECK: '1'
      UNITY_NO_CONSENT_PROMPT: '1'
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Instalar dependências gráficas e bibliotecas antigas do Unity
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1 libgconf-2-4

      - name: Instalar Unity CLI oficial
        run: |
          curl -fsSL https://unity.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Desativar análise de uso da Unity CLI
        run: |
          unity analytics opt-out
          unity analytics status

      - name: Entrar na conta Unity pelo link seguro
        run: |
          echo "Aguardando autorização da conta Unity pelo link temporário exibido abaixo."
          timeout 10m unity auth login
          unity auth status

      - name: Ativar licença gratuita Unity Personal
        run: |
          unity license activate --personal --accept-eula --non-interactive
          unity license status
          test -s "$HOME/.config/unity3d/Unity/licenses/UnityEntitlementLicense.xml"

      - name: Instalar Unity Editor 2019.2.6f1 com suporte Android
        run: |
          unity install 2019.2.6f1 -m android --cm --accept-eula
          unity editors --installed
          EDITOR_PATH="$(find "$HOME" -type f -path '*/2019.2.6f1/Editor/Unity' -print -quit 2>/dev/null)"
          if [ -z "$EDITOR_PATH" ]; then
            echo "Não encontrei o executável do Unity Editor 2019.2.6f1."
            find "$HOME" -maxdepth 7 -type f -name Unity -print 2>/dev/null | head -50
            exit 1
          fi
          echo "UNITY_EDITOR_PATH=$EDITOR_PATH" >> "$GITHUB_ENV"

      - name: Preparar compilação Android
        shell: bash
        run: |
          mkdir -p UnityPUBG/Assets/Editor
          cat > UnityPUBG/Assets/Editor/CIAndroidBuild.cs <<'CS'
          using System;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEngine;

          public static class CIAndroidBuild
          {
              public static void PerformBuild()
              {
                  EditorUserBuildSettings.SwitchActiveBuildTarget(BuildTargetGroup.Android, BuildTarget.Android);
                  string[] scenes = EditorBuildSettings.scenes
                      .Where(scene => scene.enabled)
                      .Select(scene => scene.path)
                      .ToArray();

                  if (scenes.Length == 0)
                      throw new Exception("Nenhuma cena está habilitada em Build Settings.");

                  var options = new BuildPlayerOptions
                  {
                      scenes = scenes,
                      locationPathName = "build/Android/BALA-E-FOGO.apk",
                      target = BuildTarget.Android,
                      options = BuildOptions.None
                  };

                  System.IO.Directory.CreateDirectory("build/Android");
                  BuildReport report = BuildPipeline.BuildPlayer(options);
                  Debug.Log("CI_BUILD_RESULT=" + report.summary.result);
                  Debug.Log("CI_BUILD_OUTPUT=" + options.locationPathName);
                  if (report.summary.result != BuildResult.Succeeded)
                      throw new Exception("Build Android falhou: " + report.summary.result);
              }
          }
          CS

      - name: Validar credenciais Unity para o Editor 2019
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Faltam os secrets UNITY_EMAIL e/ou UNITY_PASSWORD nas configurações do repositório."
            exit 1
          fi

      - name: Compilar APK Android com autenticação do Editor legado
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          "$UNITY_EDITOR_PATH" -batchmode -nographics -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath "$GITHUB_WORKSPACE/UnityPUBG" -executeMethod CIAndroidBuild.PerformBuild -logFile "$GITHUB_WORKSPACE/unity-build.log" -quit

      - name: Mostrar resumo do Editor se a compilação falhar
        if: failure()
        run: |
          if [ -f unity-build.log ]; then
            tail -200 unity-build.log
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BALA-E-FOGO-APK
          path: build/Android/BALA-E-FOGO.apk
          if-no-files-found: error
          retention-days: 14
